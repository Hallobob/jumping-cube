<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b17">
    <title>Jumping Cube Deluxe</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080b17;
        color: #edf5ff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px 16px;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse at 50% 0%, #14264a 0, transparent 48%),
          radial-gradient(ellipse at 8% 85%, #10223a 0, transparent 34%),
          #080b17;
      }

      .game-shell { width: min(100%, 980px); }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 0 2px 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border: 1px solid #65ffcc88;
        border-radius: 8px;
        background: #63ffd51a;
        color: #65ffcc;
        box-shadow: 0 0 22px #35efb22b;
        transform: rotate(-8deg);
      }

      .top-note {
        color: #93a6c1;
        font-size: 12px;
        letter-spacing: .04em;
      }

      .screen {
        position: relative;
        overflow: hidden;
        border: 1px solid #5b7698;
        border-radius: 18px;
        background: #0c1222;
        box-shadow: 0 30px 90px #0008, 0 0 55px #24d8c214;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 900 / 500;
        touch-action: manipulation;
        outline: none;
      }

      .bottom-bar {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 13px 3px 0;
        color: #9cacc4;
        font-size: 12px;
        letter-spacing: .02em;
      }

      .bottom-bar strong { color: #e7f2ff; font-weight: 700; }
      .accent { color: #65ffcc; }

      @media (max-width: 600px) {
        body { padding: 16px 10px; }
        .topbar { margin-bottom: 9px; }
        .top-note { display: none; }
        .screen { border-radius: 12px; }
        .bottom-bar { font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">↗</span> Jumping Cube <span class="accent">Deluxe</span></div>
        <div class="top-note">Four levels · Challenge Mode</div>
      </header>
      <div class="screen">
        <canvas id="game" width="900" height="500" tabindex="0" aria-label="Jumping Cube Deluxe game. Press Space or click to play and jump."></canvas>
      </div>
      <footer class="bottom-bar">
        <span><strong>SPACE</strong> / <strong>CLICK</strong> to jump · hold for a higher Ball jump</span>
        <span>Find <strong class="accent">???</strong> in the Challenge · avoid spikes</span>
      </footer>
    </main>

    <script>
      (() => {
        "use strict";

        const canvas = document.querySelector("#game");
        const ctx = canvas.getContext("2d");
        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;
        const FLOOR = 420;
        const PLAYER_SIZE = 40;
        const HOME_BUTTON = { x: 790, y: 52, w: 88, h: 32 };
        const LEVEL_ONE_LENGTH = 7400;
        const LEVEL_TWO_LENGTH = 5200;
        const LEVEL_THREE_LENGTH = 6000;
        const LEVEL_FOUR_LENGTH = 7600;
        const LEVEL_CARD_X = [65, 255, 445, 635];
        const BALL_HOLD_BOOST = 0.45;
        const BALL_MAX_HOLD = 24;
        const NOVA_DASH_COOLDOWN = 14;

        const levelOneObjects = [
          { type: "spike", x: 500 }, { type: "spike", x: 800 },
          { type: "spike", x: 1300 }, { type: "spike", x: 2000 },
          { type: "spike", x: 2700 },
          { type: "orb", x: 1050, y: 280 },
          { type: "coin", x: 1450, y: 220 }, { type: "coin", x: 2800, y: 140 },
          { type: "coin", x: 3600, y: 200 }, { type: "coin", x: 7000, y: 200 },
          { type: "portal", mode: "wave", x: 1800 },
          { type: "waveBlock", x: 2200, y: 80 }, { type: "waveBlock", x: 2500, y: 350 },
          { type: "portal", mode: "ship", x: 3000 },
          { type: "shipBlock", x: 3300, y: 200, w: 30, h: 150 },
          { type: "shipBlock", x: 3650, y: 300, w: 30, h: 150 },
          { type: "shipBlock", x: 4000, y: 100, w: 30, h: 200 },
          { type: "portal", mode: "ball", x: 4400 },
          { type: "ballBlock", x: 4700, y: 300, w: 40, h: 40 },
          { type: "ballBlock", x: 5000, y: 200, w: 40, h: 40 },
          { type: "ballBlock", x: 5300, y: 350, w: 40, h: 40 },
          { type: "portal", mode: "gravity", x: 5700 },
          { type: "gravityBlock", x: 6000, y: 50, w: 60, h: 30 },
          { type: "gravityBlock", x: 6300, y: 380, w: 60, h: 30 },
          { type: "gravityBlock", x: 6600, y: 120, w: 60, h: 30 }
        ];

        const levelTwoObjects = [
          { type: "spike", x: 450 }, { type: "spike", x: 1080 },
          { type: "spike", x: 1420 }, { type: "spike", x: 2300 },
          { type: "spike", x: 3000 }, { type: "spike", x: 3900 },
          { type: "jumpPad", x: 760, y: 405 },
          { type: "jumpPad", x: 1250, y: 405 },
          { type: "jumpPad", x: 2100, y: 405 },
          { type: "jumpPad", x: 3500, y: 405 },
          { type: "jumpPad", x: 4450, y: 405 },
          { type: "coin", x: 790, y: 245 },
          { type: "coin", x: 1670, y: 200 },
          { type: "coin", x: 2770, y: 180 },
          { type: "coin", x: 4200, y: 190 },
          { type: "portal", mode: "tram", x: 1750 },
          { type: "tramBlock", x: 2550, y: 0, w: 34, h: 85 },
          { type: "tramBlock", x: 3250, y: 335, w: 34, h: 85 },
          { type: "tramBlock", x: 4200, y: 0, w: 34, h: 85 },
          { type: "tramBlock", x: 4800, y: 335, w: 34, h: 85 }
        ];

        const levelThreeObjects = [
          { type: "spike", x: 450 }, { type: "spike", x: 1180 },
          { type: "spike", x: 2080 }, { type: "spike", x: 2980 },
          { type: "spike", x: 3850 }, { type: "spike", x: 5300 },
          { type: "coin", x: 720, y: 240 }, { type: "coin", x: 1740, y: 175 },
          { type: "coin", x: 3420, y: 165 }, { type: "coin", x: 4750, y: 180 },
          { type: "jumpPad", x: 760, y: 405 },
          { type: "portal", mode: "wave", x: 850 },
          { type: "waveBlock", x: 1080, y: 70 },
          { type: "waveBlock", x: 1320, y: 335 },
          { type: "portal", mode: "ship", x: 1650 },
          { type: "shipBlock", x: 1880, y: 0, w: 35, h: 145 },
          { type: "shipBlock", x: 2050, y: 270, w: 35, h: 150 },
          { type: "portal", mode: "ball", x: 2500 },
          { type: "ballBlock", x: 2730, y: 300, w: 45, h: 45 },
          { type: "ballBlock", x: 2920, y: 190, w: 45, h: 45 },
          { type: "portal", mode: "gravity", x: 3400 },
          { type: "gravityBlock", x: 3620, y: 0, w: 70, h: 35 },
          { type: "gravityBlock", x: 3800, y: 375, w: 70, h: 35 },
          { type: "portal", mode: "tram", x: 4300 },
          { type: "tramBlock", x: 4610, y: 0, w: 36, h: 85 },
          { type: "tramBlock", x: 4870, y: 335, w: 36, h: 85 },
          { type: "tramBlock", x: 5100, y: 0, w: 36, h: 85 }
        ];

        const levelFourObjects = [
          { type: "spike", x: 430 }, { type: "spike", x: 700 },
          { type: "coin", x: 820, y: 245 },
          { type: "portal", mode: "wave", x: 900 },
          { type: "waveBlock", x: 1110, y: 75 },
          { type: "waveBlock", x: 1280, y: 330 },
          { type: "waveBlock", x: 1450, y: 100 },
          { type: "portal", mode: "ship", x: 1660 },
          { type: "shipBlock", x: 1870, y: 0, w: 38, h: 135 },
          { type: "shipBlock", x: 2080, y: 285, w: 38, h: 135 },
          { type: "shipBlock", x: 2290, y: 0, w: 38, h: 175 },
          { type: "portal", mode: "ball", x: 2510 },
          { type: "ballBlock", x: 2730, y: 305, w: 48, h: 48 },
          { type: "ballBlock", x: 2910, y: 190, w: 48, h: 48 },
          { type: "ballBlock", x: 3090, y: 280, w: 48, h: 48 },
          { type: "coin", x: 3210, y: 190 },
          { type: "portal", mode: "gravity", x: 3450 },
          { type: "gravityBlock", x: 3670, y: 0, w: 75, h: 40 },
          { type: "gravityBlock", x: 3880, y: 370, w: 75, h: 40 },
          { type: "gravityBlock", x: 4090, y: 0, w: 75, h: 40 },
          { type: "portal", mode: "tram", x: 4320 },
          { type: "tramBlock", x: 4540, y: 0, w: 40, h: 100 },
          { type: "tramBlock", x: 4750, y: 320, w: 40, h: 100 },
          { type: "tramBlock", x: 4960, y: 0, w: 40, h: 100 },
          { type: "portal", mode: "nova", x: 5200 },
          { type: "novaBlock", x: 5420, y: 270, w: 48, h: 150 },
          { type: "novaBlock", x: 5600, y: 0, w: 48, h: 170 },
          { type: "novaBlock", x: 5780, y: 270, w: 48, h: 150 },
          { type: "coin", x: 6000, y: 205 },
          { type: "novaBlock", x: 6150, y: 0, w: 48, h: 185 },
          { type: "novaBlock", x: 6350, y: 255, w: 48, h: 165 },
          { type: "spike", x: 6640 },
          { type: "novaBlock", x: 6860, y: 0, w: 48, h: 180 },
          { type: "novaBlock", x: 7080, y: 265, w: 48, h: 155 },
          { type: "spike", x: 7380 }
        ];

        const colors = {
          cube: "#65ffcc", wave: "#55eaff", ship: "#ffbd59",
          ball: "#ff70b7", gravity: "#d68aff", tram: "#ff8c56",
          nova: "#c27bff"
        };
        let objects = levelOneObjects;
        let level = 1;
        let selectedLevel = 1;
        const speedLevels = [
          { name: "CHILL", multiplier: 0.75 },
          { name: "NORMAL", multiplier: 1 },
          { name: "TURBO", multiplier: 1.3 }
        ];
        let selectedSpeed = 1;
        let tramAtTop = false;
        let levelLength = LEVEL_ONE_LENGTH;
        const player = { x: 120, y: 380, w: PLAYER_SIZE, h: PLAYER_SIZE, vy: 0, vx: 0, rotation: 0 };
        let state = "menu";
        let mode = "cube";
        let camera = 0;
        let best = readBest();
        let coins = 0;
        let waveY = 250;
        let gravityDirection = 1;
        let ballJumpHoldTime = 0;
        let ballJumpHeld = false;
        let novaCooldown = 0;
        const movementTrail = [];
        const TRAIL_LIFETIME = 24;
        let holding = false;
        let keyHeld = false;
        let previousTime = 0;
        let messageTimer = 0;

        function readBest() {
          try {
            return Number(localStorage.getItem("jumping-cube-best")) || 0;
          } catch {
            return 0;
          }
        }

        function reset() {
          level = 1;
          levelLength = LEVEL_ONE_LENGTH;
          objects = levelOneObjects;
          camera = 0;
          mode = "cube";
          coins = 0;
          waveY = 250;
          gravityDirection = 1;
          ballJumpHoldTime = 0;
          ballJumpHeld = false;
          novaCooldown = 0;
          movementTrail.length = 0;
          tramAtTop = false;
          player.x = 120;
          player.y = 380;
          player.vy = 0;
          player.vx = 0;
          player.rotation = 0;
          [...levelOneObjects, ...levelTwoObjects, ...levelThreeObjects, ...levelFourObjects]
            .forEach(object => { object.collected = false; });
        }

        function beginLevel(targetLevel) {
          level = targetLevel;
          levelLength = [0, LEVEL_ONE_LENGTH, LEVEL_TWO_LENGTH, LEVEL_THREE_LENGTH, LEVEL_FOUR_LENGTH][level];
          objects = [null, levelOneObjects, levelTwoObjects, levelThreeObjects, levelFourObjects][level];
          camera = 0;
          mode = "cube";
          waveY = 250;
          gravityDirection = 1;
          ballJumpHoldTime = 0;
          ballJumpHeld = false;
          novaCooldown = 0;
          movementTrail.length = 0;
          tramAtTop = false;
          player.y = FLOOR - player.h;
          player.vy = 0;
          player.vx = 0;
          player.rotation = 0;
          state = "playing";
        }

        function startOrJump() {
          if (state === "menu") {
            reset();
            beginLevel(selectedLevel);
            return;
          }
          if (state === "levelTransition") {
            beginLevel(level + 1);
            return;
          }
          if (state === "over" || state === "won") {
            reset();
            beginLevel(selectedLevel);
            return;
          }
          if (mode === "cube" && player.y >= FLOOR - player.h - 0.1) {
            player.vy = -12;
          } else if (mode === "ship") {
            player.vy = -5;
          } else if (mode === "ball" && player.y >= FLOOR - player.h - 0.1) {
            player.vy = -11;
            player.vx = 3.5;
            ballJumpHoldTime = 0;
            ballJumpHeld = true;
          } else if (mode === "tram") {
            tramAtTop = !tramAtTop;
            player.y = tramAtTop ? 18 : FLOOR - player.h;
            player.vy = 0;
          } else if (mode === "nova" && novaCooldown <= 0) {
            player.vy = -10;
            novaCooldown = NOVA_DASH_COOLDOWN;
          } else if (mode === "gravity") {
            gravityDirection *= -1;
          }
        }

        function onKeyDown(event) {
          if (state !== "menu" && (event.code === "Escape" || event.code === "KeyH")) {
            event.preventDefault();
            goHome();
            return;
          }
          if (state === "menu" && (event.code === "ArrowLeft" || event.code === "ArrowRight")) {
            event.preventDefault();
            const direction = event.code === "ArrowRight" ? 1 : -1;
            selectedLevel = (selectedLevel - 1 + direction + 4) % 4 + 1;
            return;
          }
          if (state === "menu" && (event.code === "ArrowUp" || event.code === "ArrowDown")) {
            event.preventDefault();
            selectedSpeed = (selectedSpeed + (event.code === "ArrowDown" ? 1 : speedLevels.length - 1)) % speedLevels.length;
            return;
          }
          if (event.code !== "Space" && event.code !== "ArrowUp") return;
          event.preventDefault();
          holding = true;
          if (!keyHeld) startOrJump();
          keyHeld = true;
        }

        function onKeyUp(event) {
          if (event.code !== "Space" && event.code !== "ArrowUp") return;
          holding = false;
          keyHeld = false;
          ballJumpHeld = false;
        }

        document.addEventListener("keydown", onKeyDown);
        document.addEventListener("keyup", onKeyUp);
        window.addEventListener("blur", () => {
          holding = false;
          keyHeld = false;
          ballJumpHeld = false;
        });
        canvas.addEventListener("pointerdown", event => {
          event.preventDefault();
          canvas.focus();
          const bounds = canvas.getBoundingClientRect();
          const x = (event.clientX - bounds.left) * WIDTH / bounds.width;
          const y = (event.clientY - bounds.top) * HEIGHT / bounds.height;
          if (state !== "menu" &&
              x >= HOME_BUTTON.x && x <= HOME_BUTTON.x + HOME_BUTTON.w &&
              y >= HOME_BUTTON.y && y <= HOME_BUTTON.y + HOME_BUTTON.h) {
            goHome();
            return;
          }
          if (state === "menu") {
            if (y >= 211 && y <= 274) {
              const cardIndex = LEVEL_CARD_X.findIndex(cardX => x >= cardX && x <= cardX + 166);
              if (cardIndex >= 0) selectedLevel = cardIndex + 1;
              return;
            }
            if (y >= 294 && y <= 342 && x >= 228 && x <= 672) {
              selectedSpeed = Math.min(speedLevels.length - 1, Math.floor((x - 228) / 148));
              return;
            }
            if (y >= 352 && y <= 411 && x >= 335 && x <= 565) {
              startOrJump();
              return;
            }
          }
          holding = true;
          startOrJump();
        });
        window.addEventListener("pointerup", () => {
          holding = false;
          ballJumpHeld = false;
        });

        function overlaps(ax, ay, aw, ah, bx, by, bw, bh) {
          return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
        }

        function goHome() {
          reset();
          state = "menu";
          holding = false;
          keyHeld = false;
        }

        function update(delta) {
          if (state !== "playing") return;
          const step = Math.min(delta * speedLevels[selectedSpeed].multiplier, 2.2);
          const previousMode = mode;
          for (const point of movementTrail) point.age += delta;
          while (movementTrail.length && movementTrail[0].age >= TRAIL_LIFETIME) {
            movementTrail.shift();
          }
          camera += 4 * step;
          messageTimer = Math.max(0, messageTimer - delta);
          const previousPlayerY = player.y;
          const distanceBeforeLevel = level === 1 ? 0 :
            level === 2 ? LEVEL_ONE_LENGTH :
            level === 3 ? LEVEL_ONE_LENGTH + LEVEL_TWO_LENGTH :
              LEVEL_ONE_LENGTH + LEVEL_TWO_LENGTH + LEVEL_THREE_LENGTH;
          best = Math.max(best, Math.floor(distanceBeforeLevel + camera));

          if (mode === "cube") {
            player.vy += 0.7 * step;
            player.y += player.vy * step;
            if (player.y > FLOOR - player.h) {
              player.y = FLOOR - player.h;
              player.vy = 0;
            }
            player.rotation += 6 * step;
          } else if (mode === "tram") {
            player.y = tramAtTop ? 18 : FLOOR - player.h;
            player.vy = 0;
            player.rotation += 1.5 * step;
          } else if (mode === "wave") {
            waveY += (holding ? -5 : 5) * step;
            if (waveY < 8 || waveY > HEIGHT - 25) state = "over";
          } else if (mode === "ship") {
            player.vy += 0.22 * step;
            if (holding) player.vy -= 0.38 * step;
            player.vy = Math.max(-5, Math.min(5, player.vy));
            player.y += player.vy * step;
            player.y = Math.max(0, Math.min(HEIGHT - player.h, player.y));
            if (player.y === 0 || player.y === HEIGHT - player.h) player.vy = 0;
            player.x = 120;
          } else if (mode === "ball") {
            let holdStep = 0;
            if (ballJumpHeld && holding && player.vy < 0) {
              holdStep = Math.min(step, BALL_MAX_HOLD - ballJumpHoldTime);
              ballJumpHoldTime += holdStep;
            }
            player.vy += 0.8 * step - BALL_HOLD_BOOST * holdStep;
            if (player.vy >= 0) ballJumpHeld = false;
            player.y += player.vy * step;
            player.x += player.vx * step;
            player.vx *= Math.pow(0.99, step);
            if (player.y > FLOOR - player.h) {
              player.y = FLOOR - player.h;
              player.vy = -player.vy * 0.6;
              ballJumpHeld = false;
              ballJumpHoldTime = 0;
              if (Math.abs(player.vy) < 0.8) player.vy = 0;
              player.vx *= Math.pow(0.97, step);
            }
            if (player.x < 20) { player.x = 20; player.vx = Math.abs(player.vx) * 0.5; }
            if (player.x > WIDTH - player.w - 20) {
              player.x = WIDTH - player.w - 20;
              player.vx = -Math.abs(player.vx) * 0.5;
            }
          } else if (mode === "nova") {
            novaCooldown = Math.max(0, novaCooldown - step);
            player.vy += 0.55 * step;
            player.y += player.vy * step;
            if (player.y > FLOOR - player.h) {
              player.y = FLOOR - player.h;
              player.vy = 0;
            }
            if (player.y < 0) {
              player.y = 0;
              player.vy = 0;
            }
            player.x = 120;
            player.rotation += 7 * step;
          } else if (mode === "gravity") {
            player.vy += 0.7 * gravityDirection * step;
            player.y += player.vy * step;
            if (player.y > FLOOR - player.h) {
              player.y = FLOOR - player.h;
              if (gravityDirection > 0) player.vy = 0;
            }
            if (player.y < 0) {
              player.y = 0;
              if (gravityDirection < 0) player.vy = 0;
            }
            player.x = 120;
            player.rotation += 8 * step;
          }

          for (const object of objects) {
            const screenX = object.x - camera;
            if (object.type === "coin" && !object.collected) {
              const centerY = mode === "wave" ? waveY + 10 : player.y + player.h / 2;
              if (Math.abs(player.x + player.w / 2 - screenX) < 30 &&
                  Math.abs(centerY - object.y) < 40) {
                object.collected = true;
                coins++;
              }
            }

            if (object.type === "orb" && mode === "cube" && holding &&
                overlaps(player.x, player.y, player.w, player.h, screenX - 14, object.y - 14, 28, 28)) {
              player.vy = -18;
            }

            if (mode === "cube" && object.type === "jumpPad" &&
                player.vy >= 0 &&
                (previousPlayerY + player.h <= object.y + 8 || player.y >= FLOOR - player.h - 0.1) &&
                overlaps(player.x, player.y, player.w, player.h, screenX - 20, object.y, 40, 15)) {
              player.y = object.y - player.h;
              player.vy = -19;
              object.bounceTimer = 12;
            }

            if (object.type === "portal" && Math.abs(screenX - player.x) < 30 && mode !== object.mode) {
              mode = object.mode;
              if (mode === "wave") waveY = player.y + player.h / 2;
              if (mode === "ship") { player.vy = 0; player.y = 250; }
              if (mode === "ball") {
                player.vy = 0;
                player.vx = 2;
                player.y = FLOOR - player.h;
                ballJumpHoldTime = 0;
                ballJumpHeld = false;
              }
              if (mode === "gravity") { player.vy = 0; player.y = 200; gravityDirection = 1; }
              if (mode === "nova") {
                player.vy = 0;
                player.y = 250;
                novaCooldown = 0;
              }
              if (mode === "tram") {
                player.vy = 0;
                player.vx = 0;
                tramAtTop = false;
                player.y = FLOOR - player.h;
              }
              messageTimer = 80;
            }

            if (object.type === "spike") {
              if (mode === "wave") {
                if (waveY + 10 > 390 && waveY + 10 < 430 &&
                    player.x + 25 > screenX && player.x < screenX + 30) state = "over";
              } else if (overlaps(player.x, player.y, player.w, player.h, screenX, 390, 30, 30)) {
                state = "over";
              }
            }

            if (object.type === "waveBlock" && mode === "wave" &&
                overlaps(player.x, waveY, 25, 20, screenX, object.y, 50, 50)) state = "over";

            if ((object.type === "shipBlock" && mode === "ship") ||
                (object.type === "tramBlock" && mode === "tram") ||
                (object.type === "gravityBlock" && mode === "gravity") ||
                (object.type === "novaBlock" && mode === "nova")) {
              if (overlaps(player.x, player.y, player.w, player.h, screenX, object.y, object.w, object.h)) {
                state = "over";
              }
            }

            if (object.type === "ballBlock" && mode === "ball" &&
                overlaps(player.x, player.y, player.w, player.h, screenX, object.y, object.w, object.h)) {
              ballJumpHeld = false;
              ballJumpHoldTime = 0;
              const overlapX = Math.min(player.x + player.w, screenX + object.w) - Math.max(player.x, screenX);
              const overlapY = Math.min(player.y + player.h, object.y + object.h) - Math.max(player.y, object.y);
              if (overlapX < overlapY) {
                if (player.x < screenX) player.x = screenX - player.w;
                else player.x = screenX + object.w;
                player.vx = -player.vx * 0.8;
              } else if (player.y < object.y) {
                player.y = object.y - player.h;
                player.vy = -Math.abs(player.vy) * 0.8;
              } else {
                player.y = object.y + object.h;
                player.vy = Math.abs(player.vy) * 0.8;
              }
            }
          }

          if (mode !== previousMode) movementTrail.length = 0;
          if (mode === "wave" || mode === "ship") {
            movementTrail.push({
              x: player.x + player.w / 2 + camera,
              y: mode === "wave" ? waveY + 10 : player.y + player.h / 2,
              age: 0,
              color: colors[mode]
            });
          }

          if (camera >= levelLength) {
            state = level < 4 ? "levelTransition" : "won";
            if (state === "won") saveBest();
          }
          if (state === "over") saveBest();
        }

        function saveBest() {
          try {
            localStorage.setItem("jumping-cube-best", String(best));
          } catch {
            // The score remains available for this session when storage is disabled.
          }
        }

        function roundedRect(x, y, width, height, radius) {
          ctx.beginPath();
          ctx.roundRect(x, y, width, height, radius);
        }

        function drawBackground() {
          const gradient = ctx.createLinearGradient(0, 0, 0, HEIGHT);
          gradient.addColorStop(0, "#172b50");
          gradient.addColorStop(0.64, "#11192d");
          gradient.addColorStop(1, "#090d18");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, WIDTH, HEIGHT);

          ctx.fillStyle = "#b9d8ff";
          for (let i = 0; i < 48; i++) {
            const x = (i * 197 + 31 - camera * 0.12) % WIDTH;
            const y = (i * 83 + 27) % 310;
            ctx.globalAlpha = 0.22 + ((i * 7) % 7) / 18;
            ctx.fillRect(x, y, i % 5 === 0 ? 2 : 1, i % 5 === 0 ? 2 : 1);
          }
          ctx.globalAlpha = 1;

          ctx.strokeStyle = "#83a8dc0c";
          ctx.lineWidth = 1;
          const gridOffset = -(camera * 0.35 % 45);
          for (let x = gridOffset; x < WIDTH; x += 45) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, FLOOR);
            ctx.stroke();
          }
          for (let y = 30; y < FLOOR; y += 45) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(WIDTH, y);
            ctx.stroke();
          }
        }

        function drawPortal(x, objectMode) {
          const color = colors[objectMode];
          ctx.save();
          ctx.shadowColor = color;
          ctx.shadowBlur = 20;
          ctx.strokeStyle = color;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.ellipse(x, 250, 22, 38, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
          ctx.fillStyle = "#f4f7ff";
          ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(objectMode === "nova" ? "???" : objectMode.toUpperCase(), x, 253);
        }

        function drawObjects() {
          for (const object of objects) {
            const x = object.x - camera;
            if (x < -100 || x > WIDTH + 100) continue;

            if (object.type === "spike") {
              ctx.save();
              ctx.shadowColor = "#ff557a";
              ctx.shadowBlur = 14;
              ctx.fillStyle = "#ff557a";
              ctx.beginPath();
              ctx.moveTo(x, FLOOR);
              ctx.lineTo(x + 15, 390);
              ctx.lineTo(x + 30, FLOOR);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
            } else if (object.type === "orb") {
              ctx.save();
              ctx.shadowColor = "#ffe66e";
              ctx.shadowBlur = 16;
              ctx.fillStyle = "#ffe66e";
              ctx.beginPath();
              ctx.arc(x, object.y, 10, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            } else if (object.type === "coin" && !object.collected) {
              ctx.save();
              ctx.shadowColor = "#ffd76a";
              ctx.shadowBlur = 15;
              ctx.fillStyle = "#ffd76a";
              ctx.beginPath();
              ctx.arc(x, object.y, 9, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#fff4c2";
              ctx.beginPath();
              ctx.arc(x - 2.5, object.y - 2.5, 2.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            } else if (object.type === "portal") {
              drawPortal(x, object.mode);
            } else if (object.type === "jumpPad") {
              const bounce = object.bounceTimer > 0;
              object.bounceTimer = Math.max(0, (object.bounceTimer || 0) - 1);
              ctx.save();
              ctx.shadowColor = "#65ffcc";
              ctx.shadowBlur = 16;
              ctx.fillStyle = "#65ffcc";
              roundedRect(x - 20, object.y + (bounce ? 5 : 0), 40, bounce ? 9 : 15, 5);
              ctx.fill();
              ctx.fillStyle = "#eafff8";
              ctx.fillRect(x - 11, object.y + 3 + (bounce ? 5 : 0), 22, 3);
              ctx.restore();
            } else {
              const palette = {
                waveBlock: "#db6fff", shipBlock: "#ab82ff",
                ballBlock: "#59baff", gravityBlock: "#d674ff",
                tramBlock: "#ff8c56", novaBlock: "#c27bff"
              };
              const width = object.w || 50;
              const height = object.h || 50;
              ctx.save();
              ctx.shadowColor = palette[object.type];
              ctx.shadowBlur = 15;
              ctx.fillStyle = `${palette[object.type]}30`;
              ctx.strokeStyle = palette[object.type];
              ctx.lineWidth = 2;
              roundedRect(x, object.y, width, height, 5);
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            }
          }
        }

        function drawMovementTrail() {
          ctx.save();
          for (const point of movementTrail) {
            const progress = point.age / TRAIL_LIFETIME;
            const x = point.x - camera;
            if (x < -10 || x > WIDTH + 10) continue;
            ctx.globalAlpha = (1 - progress) * 0.45;
            ctx.fillStyle = point.color;
            ctx.beginPath();
            ctx.arc(x, point.y, 1 + (1 - progress) * 4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        function drawPlayer() {
          if (mode === "wave") {
            ctx.save();
            ctx.shadowColor = colors.wave;
            ctx.shadowBlur = 18;
            ctx.fillStyle = colors.wave;
            ctx.beginPath();
            ctx.moveTo(player.x, waveY);
            ctx.lineTo(player.x + 26, waveY + 10);
            ctx.lineTo(player.x, waveY + 20);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "#55eaff55";
            ctx.beginPath();
            ctx.moveTo(player.x - 16, waveY - 5);
            ctx.lineTo(player.x - 5, waveY + 5);
            ctx.lineTo(player.x - 16, waveY + 15);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            return;
          }

          ctx.save();
          ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
          const currentColor = colors[mode];
          ctx.shadowColor = currentColor;
          ctx.shadowBlur = 20;
          ctx.fillStyle = currentColor;

          if (mode === "ship") {
            ctx.rotate(Math.max(-0.25, Math.min(0.25, player.vy * 0.035)));
            ctx.beginPath();
            ctx.moveTo(-20, -3);
            ctx.lineTo(20, -3);
            ctx.lineTo(12, 12);
            ctx.lineTo(-13, 12);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#fff1c4";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-3, -3);
            ctx.lineTo(-3, -19);
            ctx.stroke();
            ctx.fillStyle = "#fff1c4";
            ctx.beginPath();
            ctx.moveTo(-1, -17);
            ctx.lineTo(11, -4);
            ctx.lineTo(-1, -4);
            ctx.closePath();
            ctx.fill();
          } else if (mode === "nova") {
            ctx.rotate(player.rotation * Math.PI / 180);
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
              const radius = i % 2 === 0 ? 20 : 9;
              const angle = -Math.PI / 2 + i * Math.PI / 4;
              const x = Math.cos(angle) * radius;
              const y = Math.sin(angle) * radius;
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "#fff4ff";
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fill();
          } else if (mode === "ball") {
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#fff9";
            ctx.beginPath();
            ctx.arc(-6, -7, 5, 0, Math.PI * 2);
            ctx.fill();
          } else if (mode === "tram") {
            ctx.fillStyle = "#ff8c56";
            roundedRect(-21, -16, 42, 26, 6);
            ctx.fill();
            ctx.fillStyle = "#fff1df";
            roundedRect(-12, -11, 12, 9, 2);
            ctx.fill();
            ctx.fillStyle = "#513020";
            ctx.beginPath();
            ctx.arc(-12, 13, 5, 0, Math.PI * 2);
            ctx.arc(13, 13, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffc18f";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-26, 20);
            ctx.lineTo(26, 20);
            ctx.stroke();
          } else {
            ctx.rotate(player.rotation * Math.PI / 180);
            ctx.fillRect(-20, -20, 40, 40);
            if (mode === "gravity") {
              ctx.shadowBlur = 0;
              ctx.fillStyle = "#fff";
              ctx.font = "bold 18px ui-sans-serif, system-ui, sans-serif";
              ctx.textAlign = "center";
              ctx.fillText(gravityDirection > 0 ? "↓" : "↑", 0, 6);
            }
          }
          ctx.restore();
        }

        function drawHud() {
          ctx.fillStyle = "#f4f7ff";
          ctx.textAlign = "left";
          ctx.font = "700 14px ui-sans-serif, system-ui, sans-serif";
          ctx.fillText(`COINS  ${coins}`, 24, 34);
          ctx.fillStyle = "#afc0da";
          ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
          ctx.fillText(`BEST  ${best}`, 24, 54);

          ctx.textAlign = "right";
          ctx.fillStyle = colors[mode];
          ctx.font = "800 12px ui-sans-serif, system-ui, sans-serif";
          ctx.fillText(mode.toUpperCase(), 870, 34);
          ctx.textAlign = "left";

          roundedRect(250, 22, 400, 7, 4);
          ctx.fillStyle = "#ffffff22";
          ctx.fill();
          roundedRect(250, 22, Math.max(8, 400 * Math.min(camera / levelLength, 1)), 7, 4);
          ctx.fillStyle = "#65ffcc";
          ctx.fill();
        }

        function drawHomeButton() {
          ctx.save();
          roundedRect(HOME_BUTTON.x, HOME_BUTTON.y, HOME_BUTTON.w, HOME_BUTTON.h, 8);
          ctx.fillStyle = "#111c30";
          ctx.fill();
          ctx.strokeStyle = "#9bb0cc88";
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = "#e8f1ff";
          ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("⌂  HOME", HOME_BUTTON.x + HOME_BUTTON.w / 2, HOME_BUTTON.y + 21);
          ctx.restore();
        }

        function drawOverlay(title, subtitle, color) {
          ctx.fillStyle = "#050916bd";
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
          ctx.textAlign = "center";
          ctx.save();
          ctx.shadowColor = color;
          ctx.shadowBlur = 24;
          ctx.fillStyle = "#f4f8ff";
          ctx.font = "800 52px ui-sans-serif, system-ui, sans-serif";
          ctx.fillText(title, WIDTH / 2, 188);
          ctx.restore();
          ctx.fillStyle = "#c5d1e5";
          ctx.font = "17px ui-sans-serif, system-ui, sans-serif";
          ctx.fillText(subtitle, WIDTH / 2, 229);
        }

        function drawMenu() {
          ctx.fillStyle = "#05091666";
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
          ctx.textAlign = "center";
          ctx.save();
          ctx.shadowColor = "#65ffcc";
          ctx.shadowBlur = 25;
          ctx.fillStyle = "#65ffcc";
          ctx.font = "900 51px ui-sans-serif, system-ui, sans-serif";
          ctx.fillText("JUMPING CUBE", WIDTH / 2, 145);
          ctx.restore();
          ctx.fillStyle = "#edf5ff";
          ctx.font = "800 20px ui-sans-serif, system-ui, sans-serif";
          ctx.fillText("DELUXE", WIDTH / 2, 177);

          ctx.fillStyle = "#a9bad3";
          ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
          ctx.fillText("CHOOSE A LEVEL OR CHALLENGE MODE", WIDTH / 2, 198);

          const levelCards = [
            { number: 1, title: "LEVEL 1", x: LEVEL_CARD_X[0], color: colors.cube, detail: "FIVE WORLDS" },
            { number: 2, title: "LEVEL 2", x: LEVEL_CARD_X[1], color: colors.tram, detail: "JUMP PADS + TRAM" },
            { number: 3, title: "LEVEL 3", x: LEVEL_CARD_X[2], color: colors.wave, detail: "ALL SIX MODES" },
            { number: 4, title: "CHALLENGE MODE", x: LEVEL_CARD_X[3], color: colors.nova, detail: "LEVEL 4 · ??? MODE" }
          ];
          for (const card of levelCards) {
            const selected = selectedLevel === card.number;
            roundedRect(card.x, 210, 166, 62, 10);
            ctx.fillStyle = selected ? `${card.color}24` : "#ffffff08";
            ctx.fill();
            ctx.lineWidth = selected ? 2 : 1;
            ctx.strokeStyle = selected ? card.color : "#ffffff2b";
            ctx.stroke();
            ctx.fillStyle = selected ? card.color : "#c2d0e6";
            ctx.font = card.number === 4
              ? "800 12px ui-sans-serif, system-ui, sans-serif"
              : "800 14px ui-sans-serif, system-ui, sans-serif";
            ctx.fillText(card.title, card.x + 83, 234);
            ctx.fillStyle = "#c2d0e6";
            ctx.font = "700 9px ui-sans-serif, system-ui, sans-serif";
            ctx.fillText(card.detail, card.x + 83, 255);
          }

          ctx.fillStyle = "#a9bad3";
          ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
          ctx.fillText("GAME SPEED", WIDTH / 2, 295);
          const speedButtons = [
            { index: 0, x: 234, color: "#55eaff" },
            { index: 1, x: 382, color: "#65ffcc" },
            { index: 2, x: 530, color: "#ff8c56" }
          ];
          for (const button of speedButtons) {
            const selected = selectedSpeed === button.index;
            roundedRect(button.x, 302, 136, 40, 9);
            ctx.fillStyle = selected ? `${button.color}24` : "#ffffff08";
            ctx.fill();
            ctx.lineWidth = selected ? 2 : 1;
            ctx.strokeStyle = selected ? button.color : "#ffffff2b";
            ctx.stroke();
            ctx.fillStyle = selected ? button.color : "#c2d0e6";
            ctx.font = "800 11px ui-sans-serif, system-ui, sans-serif";
            ctx.fillText(speedLevels[button.index].name, button.x + 68, 327);
            ctx.fillStyle = "#a9bad3";
            ctx.font = "9px ui-sans-serif, system-ui, sans-serif";
            ctx.fillText(`${speedLevels[button.index].multiplier}x`, button.x + 68, 338);
          }

          roundedRect(335, 352, 230, 55, 13);
          ctx.fillStyle = "#65ffcc";
          ctx.fill();
          ctx.fillStyle = "#071511";
          ctx.font = "900 17px ui-sans-serif, system-ui, sans-serif";
          ctx.fillText(selectedLevel === 4 ? "PLAY CHALLENGE MODE" : `PLAY LEVEL ${selectedLevel}`, WIDTH / 2, 386);

          ctx.fillStyle = "#c2d0e6";
          ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
          ctx.fillText("Click PLAY or press SPACE · ← / → level · ↑ / ↓ speed", WIDTH / 2, 432);
          const labels = [
            ["CUBE", colors.cube], ["WAVE", colors.wave], ["SHIP", colors.ship],
            ["BALL", colors.ball], ["GRAVITY", colors.gravity], ["TRAM", colors.tram]
          ];
          let x = WIDTH / 2 - 215;
          for (const [label, color] of labels) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, 469, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#c2d0e6";
            ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(label, x + 10, 473);
            x += label === "GRAVITY" ? 94 : 74;
          }
          ctx.textAlign = "center";
        }

        function draw() {
          drawBackground();
          if (state === "menu") {
            drawMenu();
            return;
          }

          ctx.fillStyle = "#202c41";
          ctx.fillRect(0, FLOOR, WIDTH, HEIGHT - FLOOR);
          ctx.fillStyle = level === 2 ? "#ff8c56" :
            level === 3 ? "#55eaff" : level === 4 ? colors.nova : "#65ffcc";
          ctx.globalAlpha = 0.56;
          ctx.fillRect(0, FLOOR, WIDTH, 2);
          ctx.globalAlpha = 1;
          if (mode === "tram" && state === "playing") {
            ctx.save();
            ctx.strokeStyle = "#ff8c5680";
            ctx.lineWidth = 2;
            ctx.setLineDash([9, 8]);
            for (const y of [74, 365]) {
              ctx.beginPath();
              ctx.moveTo(0, y);
              ctx.lineTo(WIDTH, y);
              ctx.stroke();
            }
            ctx.restore();
          }
          drawMovementTrail();
          drawObjects();
          drawPlayer();
          drawHud();
          ctx.textAlign = "left";
          ctx.fillStyle = "#afc0da";
          ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
          const levelLabel = level === 4 ? "CHALLENGE MODE" : `LEVEL ${level}`;
          ctx.fillText(`${levelLabel} · ${speedLevels[selectedSpeed].name} SPEED`, 24, 76);
          if (mode === "tram" && state === "playing") {
            ctx.textAlign = "center";
            ctx.fillStyle = colors.tram;
            ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
            ctx.fillText("SPACE / CLICK: SWITCH TRACK", WIDTH / 2, 82);
          }
          if (mode === "nova" && state === "playing") {
            ctx.textAlign = "center";
            ctx.fillStyle = colors.nova;
            ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
            ctx.fillText("SPACE / CLICK: AIR DASH", WIDTH / 2, 82);
          }

          if (messageTimer > 0 && state === "playing") {
            ctx.textAlign = "center";
            ctx.fillStyle = colors[mode];
            ctx.font = "800 14px ui-sans-serif, system-ui, sans-serif";
            ctx.fillText(`${mode.toUpperCase()} MODE`, WIDTH / 2, mode === "nova" ? 101 : 81);
          }
          if (state === "over") drawOverlay("RUN OVER", "Click or press SPACE to try again", "#ff557a");
          if (state === "levelTransition") drawOverlay(
            `LEVEL ${level} CLEAR`, `Click or press SPACE to start Level ${level + 1}`, "#65ffcc"
          );
          if (state === "won") drawOverlay(
            `LEVEL ${level} CLEAR`, `You finished with ${coins} coin${coins === 1 ? "" : "s"} · click to play again`, "#65ffcc"
          );
          drawHomeButton();
        }

        function frame(time) {
          const delta = previousTime ? Math.min((time - previousTime) / (1000 / 60), 2.2) : 1;
          previousTime = time;
          update(delta);
          draw();
          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
